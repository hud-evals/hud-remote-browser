[project]
name = "hud-remote-browser"
version = "0.2.0"
description = "HUD v6 environment: a provider-hosted cloud browser published as a cdp capability"
requires-python = ">=3.11"
dependencies = [
    "hud>=0.6.15",
    "playwright",
    "httpx",
    "google-api-python-client",
    "google-auth",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
